<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link rel="stylesheet" href="css/all.css"/>
    <link rel="stylesheet" href="css/style.css"/>
    <link rel="stylesheet" href="css/register.css"/>
    <!-- icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <!-- font -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">
    <title>Register Bage</title>
</head>
<body>
    <header>
        <div class="container-h">
            <div class="header-content">
                <a href="index.html" class="brand"><img src="images/logo.png" alt="logo" style="width:110px; height:80px ;border-radius:50% ;padding:0px 0px 5px"/>MERAUDE</a>
            </div><!-- end  header-content-->
                <div class="ll">
                    <ul id="link">
                        <li><a href="login.html">Sign In</a></li>
                        <li><a href="register.html">Sign Up</a></li>
                    </ul>
                    <ul id="user_info">
                        <li><a href="#" id="user"></a></li>
                        <li><a href="basket.html"><i class="fas fa-shopping-cart"></i> </a></li>
                    </ul>
                </div><!--end ll  -->
            </div><!-- end  container-h-->
    </header>        

    <section class="container">
        <div class="forms">
            <div class="form1">
                <h2>Register User</h2>
                <form>
                    <input type="text" placeholder="Enter First Name" id="username"/>
                    <input type="text" placeholder="Enter Last Name" id="username2"/>
                    <input type="email" placeholder="Enter Email" id="email"/>
                    <input type="password" placeholder="Enter password" id="password"/>
                    <input type="submit" value="Sign Up" id="sign_up"/>
                    <h4>You Have An Account <a href="login.html">Log In</a></h4>
                </form>
            </div>
            <div class="form2">
                <video autoplay muted loop id="bg-video">
                    <source src="images/a.mp4" type="video/mp4">
                </video> 
                <button class="btn" id="signup_btn">
                    <a href="#">Sign Up</a>
                </button>
            </div>
        </div>
    </section>

    <script src="js/register.js"></script>
</body>
</html>
